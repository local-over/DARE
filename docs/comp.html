<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARE v2 | Live Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- THEME --- */
        :root {
            --bg-dark: #000000;
            --bg-panel: #0d1117;
            --accent: #38bdf8;
            --accent-orange: #f7931a;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border: #333;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            background: #0f172a;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand {
            font-family: var(--font-mono);
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
        }

        .brand img {
            height: 32px;
            width: auto;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-links-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-right: 20px;
        }

        .nav-links-header a {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }

        .nav-links-header a:hover {
            color: var(--accent);
        }

        .examples-dropdown {
            position: relative;
        }

        .examples-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            cursor: pointer;
        }

        .examples-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #1e293b;
            border: 1px solid #334;
            border-radius: 8px;
            min-width: 180px;
            z-index: 100;
            margin-top: 6px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .examples-menu.show {
            display: block;
        }

        .examples-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 10px 16px;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: var(--font-mono);
        }

        .examples-menu button:hover {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            transition: 0.2s;
            border-radius: 4px;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-donate {
            background: linear-gradient(135deg, #f7931a 0%, #ffb74d 100%);
            color: white;
            border: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3);
        }

        .btn-donate:hover {
            transform: translateY(-2px);
            color: white;
            border: none;
        }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* EDITOR */
        .editor-container {
            width: 45%;
            display: flex;
            border-right: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .line-numbers {
            width: 45px;
            background: var(--bg-panel);
            border-right: 1px solid #222;
            color: var(--text-muted);
            text-align: right;
            padding: 20px 8px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            user-select: none;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e2e8f0;
            resize: none;
            outline: none;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            white-space: pre;
        }

        /* --- PREVIEW AREA (The "Desk") --- */
        .preview-container {
            width: 55%;
            background: #525659;
            /* Acrobat Gray */
            overflow: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Center pages */
        }

        /* This is the transparent wrapper for all pages */
        #doc-root {
            display: flex;
            flex-direction: column;
            gap: 30px;
            /* SPACE BETWEEN PAGES */
            padding-bottom: 50px;
        }

        /* --- THE PHYSICAL PAGE (The "Paper") --- */
        .dare-page {
            width: 210mm;
            height: 297mm;
            background: white;
            color: black;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            /* Drop Shadow */
            flex-shrink: 0;
        }


        /* --- DAREE V2 UTILS INJECTED --- */
        .dare-box {
            display: block;
            position: relative;
        }

        .dare-txt {
            white-space: pre-wrap;
            position: relative;
        }

        .flex-fill {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .dare-tbl {
            display: grid;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            font-size: 9.5pt;
        }

        .tc {
            padding: 6px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        .th {
            font-weight: 700;
            font-size: 8.5pt;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: #1e293b;
            color: white;
            border-bottom: none;
            padding: 8px 10px;
        }

        .ts {
            background: #f8fafc;
        }

        .dare-chart-wrap {
            page-break-inside: avoid;
            overflow: hidden;
        }

        .dare-list {
            font-size: 10pt;
            color: #334155;
            line-height: 1.5;
        }

        .dare-hdr,
        .dare-ftr {
            page-break-inside: avoid;
        }

        /* --- PRINT OVERRIDES --- */
        @media print {
            body * {
                visibility: hidden;
            }

            #doc-root,
            #doc-root * {
                visibility: visible;
            }

            #doc-root {
                position: absolute;
                left: 0;
                top: 0;
                gap: 0;
            }

            .dare-page {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
                break-after: page;
            }

            /* Hide scrollbars and UI */
            ::-webkit-scrollbar {
                display: none;
            }
        }

        /* MODAL (Same as before) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 2px solid #f7931a;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            color: white;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            border: none;
            background: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-wallet {
            background: #000;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            border: 1px dashed #555;
            word-break: break-all;
            cursor: pointer;
        }

        .modal-copied {
            color: #4ade80;
            display: none;
            margin-top: 5px;
        }

        .modal-wallet.copied~.modal-copied {
            display: block;
        }
    </style>
    <script src="dare.js"></script>
</head>

<body>

    <!-- DONATE MODAL -->
    <div class="modal-overlay" id="donateModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDonateModal()">×</button>
            <h3>Support DARE</h3>
            <p>Buy me a coffee!</p>
            <div class="modal-wallet" onclick="copyDonateAddress(this)">
                UQBEJwLa4EGPRmUKw4O1i9d_JjJGmjkJ2myqR5lborzgceT-
                <div style="font-size:0.7rem; color:#888; margin-top:5px;">USDT (TON) - Click to Copy</div>
            </div>
            <div class="modal-copied">Copied!</div>
        </div>
    </div>

    <header>
        <a href="index.html" class="brand">
            DARE<span>COMPILER</span>
            <span
                style="font-size:0.6rem; background:var(--accent); color:#000; padding:2px 6px; border-radius:3px; font-weight:700;">v2</span>

        <div class="toolbar">
            <div class="nav-links-header">
                <a href="index.html">Home</a>
                <a href="docs.html">Docs</a>
            </div>
            <span id="status" style="color:var(--text-muted); font-size:0.8rem;">READY</span>
            <div class="examples-dropdown">
                <button class="examples-btn" onclick="toggleExamples()"><i class="fa-solid fa-code"></i>
                    Examples</button>
                <div class="examples-menu" id="examplesMenu">
                    <button onclick="loadDemo()">📄 Dashboard Report</button>
                    <button onclick="loadInvoice()">🧾 Invoice</button>
                    <button onclick="loadResume()">🎓 Resume</button>
                </div>
            </div>
            <button onclick="loadDemo()">RESET</button>
            <button class="btn-donate" onclick="showDonateModal()">
                <i class="fa-solid fa-heart"></i> Donate
            </button>
        </div>
    </header>

    <div class="workspace">
        <div class="editor-container">
            <div class="line-numbers" id="line-numbers">1</div>
            <textarea id="code" spellcheck="false" oninput="handleInput()" onkeydown="handleTab(event)"></textarea>
        </div>
        <div class="preview-container">
            <div id="doc-root"></div>
        </div>
    </div>

    <script>
        // --- UI LOGIC ---
        function showDonateModal() { document.getElementById('donateModal').classList.add('show'); }
        function closeDonateModal() { document.getElementById('donateModal').classList.remove('show'); }
        function copyDonateAddress(el) {
            navigator.clipboard.writeText('UQBEJwLa4EGPRmUKw4O1i9d_JjJGmjkJ2myqR5lborzgceT-');
            el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 2000);
        }
        document.getElementById('donateModal').onclick = (e) => { if (e.target === document.getElementById('donateModal')) closeDonateModal() };


        async function compile() {
            const raw = document.getElementById('code').value;
            const status = document.getElementById('status');
            const root = document.getElementById('doc-root');

            try {
                const result = await window.DareEngine.compile(raw);
                const html = result.html;
                if (html && html.trim()) {
                    root.innerHTML = html;
                    status.innerText = "COMPILED"; status.style.color = "#4ade80";
                } else {
                    root.innerHTML = '<div style="padding:20mm; color:#ccc; text-align:center;">Waiting for @doc block...</div>';
                    status.innerText = "READY"; status.style.color = "#94a3b8";
                }
            } catch (e) {
                status.innerText = "ERROR"; status.style.color = "#f87171";
                console.error(e);
            }
        }

        function handleInput() {
            const lines = document.getElementById('code').value.split('\n').length;
            document.getElementById('line-numbers').innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
            compile();
        }

        function handleTab(e) {
            if (e.key == 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
        }

        function toggleExamples() {
            document.getElementById('examplesMenu').classList.toggle('show');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.examples-dropdown')) document.getElementById('examplesMenu').classList.remove('show');
        });
